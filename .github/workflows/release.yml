name: Release

# Push a tag like "v0.5.0" to build a signed release APK and attach it to a
# new GitHub Release. See docs/RELEASING.md for the one-time keystore setup.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Derive versionCode/versionName from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' isn't vMAJOR.MINOR.PATCH (e.g. v1.2.3) -- can't derive an Android versionCode from it."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if (( minor > 99 || patch > 99 )); then
            echo "::error::Minor/patch must each fit in 0-99 for the versionCode scheme (major*10000 + minor*100 + patch); got $TAG."
            exit 1
          fi
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        run: echo "${{ secrets.PEARTV_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease \
            -Ppeartv.versionCode="${{ steps.version.outputs.code }}" \
            -Ppeartv.versionName="${{ steps.version.outputs.name }}" \
            -Ppeartv.release.storeFile="$RUNNER_TEMP/release.jks" \
            -Ppeartv.release.storePassword="${{ secrets.PEARTV_KEYSTORE_PASSWORD }}" \
            -Ppeartv.release.keyAlias="${{ secrets.PEARTV_KEY_ALIAS }}" \
            -Ppeartv.release.keyPassword="${{ secrets.PEARTV_KEY_PASSWORD }}"

      - name: Stage APK for release
        run: cp app/build/outputs/apk/release/app-release.apk "PearTV-${{ github.ref_name }}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "PearTV-${{ github.ref_name }}.apk" \
            --title "PearTV Launcher ${{ github.ref_name }}" \
            --generate-notes
